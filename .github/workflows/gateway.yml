name: gateway
on: [push, pull_request]
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
        working-directory: openrdc-gateway
      - run: npx tsc
        working-directory: openrdc-gateway
      - run: npm test
        working-directory: openrdc-gateway
